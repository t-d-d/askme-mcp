<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>askme rules</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
<style>
body{margin:0}
a{color:#16211B}a:hover{color:#16211B}
</style>
<style>html{background:#D5DBD4}body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF1EC; color: #16211B; font-family: 'Bricolage Grotesque', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 0 8px">
<a href="list.html" style="min-height: 44px; padding: 0 12px 0 4px; display: flex; align-items: center; gap: 2px; color: #16211B; text-decoration: none; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>All asks</a>
<a href="connect.html" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; color: #16211B; font-size: 16px; font-weight: 600">Connect agents</a>
</header>

<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 31px; line-height: 1.1; font-weight: 650; letter-spacing: -0.025em">Your rules</h1>
<label for="rules" style="font-size: 15px; line-height: 1.4; color: #3D4943">Write them in plain English. Name your hashtags, say what comes first, and give any hours a hashtag should keep to.</label>
<textarea id="rules" style="width: 100%; height: 308px; box-sizing: border-box; padding: 14px 16px; border: 1.5px solid #C3CCC3; border-radius: 18px; background: #FFFFFF; color: #16211B; font-family: inherit; font-size: 16px; line-height: 1.45; resize: none">#work is my day job. Only show it on weekdays between 8am and 6pm.

#shop is my online shop. Anything a customer can see comes first.

#family is home and the children. Show it at any time.

Anything that blocks a release or costs money ranks high. Routine questions rank low.</textarea>
<button disabled style="min-height: 52px; padding: 0 20px; border: 0; border-radius: 18px; background: #DDE2DC; color: #55625B; font-family: inherit; font-size: 17px; font-weight: 650">Save rules</button>
<p style="margin: -4px 0 0; font-size: 13px; color: #55625B">Saved. The button wakes up when you change the text.</p>
</div>

<section style="padding: 22px 20px 0; display: flex; flex-direction: column">
<h2 style="margin: 0 0 8px; font-size: 15px; font-weight: 600; color: #55625B">askme read this from your rules</h2>
<div style="min-height: 46px; border-top: 1px solid #D3DAD2; display: flex; align-items: center; justify-content: space-between; font-size: 16px"><span style="padding: 4px 10px; border-radius: 10px; background: #DCE4FF; color: #1B3399; font-weight: 600">#work</span><span>Weekdays, 8am to 6pm</span></div>
<div style="min-height: 46px; border-top: 1px solid #D3DAD2; display: flex; align-items: center; justify-content: space-between; font-size: 16px"><span style="padding: 4px 10px; border-radius: 10px; background: #FFE2CC; color: #8A3A08; font-weight: 600">#shop</span><span>Any time</span></div>
<div style="min-height: 46px; border-top: 1px solid #D3DAD2; border-bottom: 1px solid #D3DAD2; display: flex; align-items: center; justify-content: space-between; font-size: 16px"><span style="padding: 4px 10px; border-radius: 10px; background: #E9DDF8; color: #54298F; font-weight: 600">#family</span><span>Any time</span></div>
<p style="margin: 10px 0 0; font-size: 13px; line-height: 1.4; color: #55625B">Hours use Europe/London, taken from this browser. Saving re-sorts every open ask.</p>
</section>

</div>
</body>
</html>
