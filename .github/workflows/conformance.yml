# Setup held outside the repo can drift with no pull request, so this runs
# every day (ADR 15). A job that signs in runs in the "conformance"
# environment, never with the deploy role.
name: conformance

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run conformance
