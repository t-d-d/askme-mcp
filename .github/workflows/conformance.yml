# Setup held outside the repo can drift with no pull request, so this runs
# every day (ADR 15). A job that signs in runs in the "conformance"
# environment, never with the deploy role.
name: conformance

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # Only the deploy and rollback jobs run the Serverless launcher, and check
      # it. Its download is the one install script on a Linux runner, so the
      # other jobs skip it. The flag repeats .npmrc, which an older commit, such
      # as live-ok, may not have.
      - run: npm ci --ignore-scripts
      - run: npm run conformance
