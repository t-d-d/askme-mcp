# The deploy role and its OIDC provider are a separate stack,
# infra/github-oidc.cfn.yml, which the deploy job applies first.
service: askme
# One exact version, whose archive the deploy job checks against its sum.
frameworkVersion: "4.43.0"

provider:
  name: aws
  region: ${env:AWS_REGION}
  stage: prod
  runtime: nodejs22.x
  timeout: 10
  # As long as an ask is kept (ADR 7).
  logRetentionInDays: 30
  logs:
    lambda:
      # JSON lets each line carry the level its console method sets (ADR 7).
      logFormat: JSON
      applicationLogLevel: INFO
      systemLogLevel: INFO
  environment:
    # Clerk's keys are public, so no Clerk secret reaches the function
    # (ADR 6).
    CLERK_ISSUER: ${env:CLERK_ISSUER}
    TABLE_NAME: !Ref Table
    SORT_QUEUE: !Ref SortQueue
    # The functions read the key itself when they first need it, so it is in
    # neither this file nor their settings.
    MODEL_KEY_PARAMETER: /askme/openrouter/api-key
  iam:
    role:
      statements:
        # No scan (ADR 13).
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:ConditionCheckItem
          Resource: !GetAtt Table.Arn
        # The parameter is encrypted with AWS's own Parameter Store key, which
        # any role allowed to read it may decrypt, so no KMS grant is needed.
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/askme/openrouter/api-key"
        # The framework grants the sort function's trigger its own read of
        # the queue.
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !GetAtt SortQueue.Arn

build:
  esbuild:
    # Lambda loads a .mjs bundle as an ES module.
    format: esm
    outExtension:
      ".js": ".mjs"

functions:
  mcp:
    handler: service/src/handler.handler
    events:
      - httpApi: "POST /mcp"
      - httpApi: "GET /mcp"
      - httpApi: "DELETE /mcp"
      - httpApi: "GET /.well-known/oauth-protected-resource/mcp"
      - httpApi: "GET /api/asks"
      - httpApi: "GET /api/connection"
      - httpApi: "GET /api/rules"
      - httpApi: "PUT /api/rules"
      - httpApi: "POST /api/asks/opened"
      - httpApi: "POST /api/asks/dismissed"
      - httpApi: "POST /api/asks/samples"

  # Off the request path, so posting never waits on the model (ADR 22).
  sort:
    handler: service/src/sorter.handler
    # Two tries at the model, of up to 20 seconds each.
    timeout: 60
    events:
      # Five runs at most, to stay inside the model provider's rate limit.
      # Reserved concurrency would instead trip the function-failures alarm
      # each time it throttled a run.
      - sqs:
          arn: !GetAtt SortQueue.Arn
          batchSize: 1
          maximumConcurrency: 5
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    # No secondary index (ADR 13). DynamoDB removes expired items late, so
    # every read checks expiresAt itself.
    Table:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # Each ask is its own message group, so one ask's jobs never run at once
    # (ADR 22). VisibilityTimeout is six times the sort function's timeout,
    # as AWS advises. No dead-letter queue: a sort that never works is a
    # warn line.
    SortQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: askme-sort.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        VisibilityTimeout: 360

    # So the account a job names always comes from a checked token.
    SortQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SortQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: OnlyTheServiceQueuesSorts
              Effect: Deny
              Principal: "*"
              Action: sqs:SendMessage
              Resource: !GetAtt SortQueue.Arn
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn: !GetAtt IamRoleLambdaExecution.Arn

    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced

    WebOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: askme-web
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: askme page
          DefaultRootObject: index.html
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_100
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            # On the page's own address, so the page needs no API address at
            # build time and no cross-origin rules.
            - Id: api
              DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
          DefaultCacheBehavior:
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed policies: CachingOptimized and SecurityHeadersPolicy.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          CacheBehaviors:
            # Each answer is one account's and the token is in a header, so
            # nothing is cached and every header but Host goes on. AWS managed
            # policies: CachingDisabled, AllViewerExceptHostHeader and
            # SecurityHeadersPolicy. CloudFront allows PUT only within its
            # full set of methods.
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: TheDistributionReadsThePage
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ["", [!GetAtt WebBucket.Arn, "/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn: !Join
                    - ""
                    - - "arn:"
                      - !Ref AWS::Partition
                      - ":cloudfront::"
                      - !Ref AWS::AccountId
                      - ":distribution/"
                      - !Ref WebDistribution

    # AWS sends a confirmation link first, and nothing arrives until the
    # owner clicks it.
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: askme-alerts
        DisplayName: askme alerts

    AlertEmail:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: email
        TopicArn: !Ref AlertTopic
        Endpoint: ${ssm:/askme/alerts/email}

    # Every function needs one of these filters, or the gate fails. With no
    # default value, a filter publishes nothing while nothing goes wrong.
    McpErrorLines:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref McpLogGroup
        FilterPattern: '{ $.level = "ERROR" }'
        MetricTransformations:
          - MetricNamespace: askme
            MetricName: ErrorLines
            MetricValue: "1"

    SortErrorLines:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref SortLogGroup
        FilterPattern: '{ $.level = "ERROR" }'
        MetricTransformations:
          - MetricNamespace: askme
            MetricName: ErrorLines
            MetricValue: "1"

    ErrorLinesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-error-lines
        AlarmDescription: >-
          [tripwire] An askme function wrote an error-level line. Run the
          saved query askme/errors first.
        Namespace: askme
        MetricName: ErrorLines
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    # Failures that write no line: a crash, a timeout, running out of memory
    # (all counted as Errors) and throttling.
    FunctionFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-function-failures
        AlarmDescription: >-
          [tripwire] An askme function failed, timed out or was throttled. Run
          the saved query askme/function-failures first. A throttle writes no
          line, so if it finds nothing, read the function's Throttles metric.
        Metrics:
          - Id: mcpErrors
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref McpLambdaFunction
              Period: 60
              Stat: Sum
          - Id: mcpThrottles
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Throttles
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref McpLambdaFunction
              Period: 60
              Stat: Sum
          - Id: sortErrors
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref SortLambdaFunction
              Period: 60
              Stat: Sum
          - Id: sortThrottles
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Throttles
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref SortLambdaFunction
              Period: 60
              Stat: Sum
          - Id: failures
            Label: Failures
            Expression: SUM(METRICS())
            ReturnData: true
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    # Catches what the first two miss, such as API Gateway failing to invoke
    # the function.
    ServerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-server-errors
        AlarmDescription: >-
          [rate] More than 5% of the API's requests ended in a server error
          over five minutes. Run the saved query askme/errors first.
        Metrics:
          - Id: serverErrors
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/ApiGateway
                MetricName: 5xx
                Dimensions:
                  - Name: ApiId
                    Value: !Ref HttpApi
              Period: 300
              Stat: Sum
          - Id: requests
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/ApiGateway
                MetricName: Count
                Dimensions:
                  - Name: ApiId
                    Value: !Ref HttpApi
              Period: 300
              Stat: Sum
          - Id: errorRate
            Label: Server errors (%)
            Expression: IF(requests > 0, 100 * FILL(serverErrors, 0) / requests, 0)
            ReturnData: true
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    # The account holds askme alone, so its bill is askme's (ADR 17). AWS
    # publishes it about every six hours, and only in us-east-1. Ignoring a
    # gap between bills stops the alarm emailing again on the next one.
    # INSUFFICIENT_DATA means the account's billing alerts are off.
    SpendAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-spend
        AlarmDescription: >-
          [tripwire] This month's AWS bill has passed the set amount. Run the
          saved query askme/lines-by-event first, then open Cost Explorer.
        Namespace: AWS/Billing
        MetricName: EstimatedCharges
        Dimensions:
          - Name: Currency
            Value: USD
        Statistic: Maximum
        Period: 21600
        EvaluationPeriods: 1
        Threshold: ${ssm:/askme/alerts/monthly-spend}
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: ignore
        AlarmActions:
          - !Ref AlertTopic

    # Product numbers are counted by these queries, never by a metric
    # (ADR 8). Each query reads every function's log group.
    ErrorsQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/errors
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          fields @timestamp, message.event, message.errorClass, message.status, message.requestId, errorType, @logStream
          | filter level = "ERROR"
          | sort @timestamp desc
          | limit 100

    FunctionFailuresQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/function-failures
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          fields @timestamp, type, record.status, record.errorType, record.requestId, @logStream
          | filter ispresent(record.status) and record.status != "success"
          | sort @timestamp desc
          | limit 100

    # Warnings are counted here, never alarmed.
    LinesByEventQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/lines-by-event
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter ispresent(message.event)
          | stats count(*) as lines by level, message.event
          | sort lines desc

    TokenMissingQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/token-missing
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "token-missing"
          | stats count(*) as calls by bin(1h)

    TokenRejectedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/token-rejected
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "token-rejected"
          | stats count(*) as calls by message.errorClass, bin(1h)

    ScopeMissingQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/scope-missing
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "scope-missing"
          | stats count(*) as calls by message.tool, bin(1h)

    AgentTokenRefusedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/agent-token-refused
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "agent-token-refused"
          | stats count(*) as calls by bin(1h)

    InputInvalidQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/input-invalid
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "input-invalid"
          | stats count(*) as calls by message.tool, bin(1d)

    AskPostedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-posted
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-posted"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    SamplePostedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sample-posted
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sample-posted"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskReplacedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-replaced
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-replaced"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskResolvedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-resolved
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-resolved"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskAlreadyClosedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-already-closed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-already-closed"
          | stats count(*) as calls, count_distinct(message.accountId) as accounts by bin(1d)

    AskNotFoundQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-not-found
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-not-found"
          | stats count(*) as calls, count_distinct(message.accountId) as accounts by bin(1d)

    AskOpenedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-opened
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-opened"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskDismissedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-dismissed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-dismissed"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskDeduplicatedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-deduplicated
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-deduplicated"
          | stats count(*) as repeats, count_distinct(message.accountId) as accounts by bin(1d)

    CapReachedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/cap-reached
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "cap-reached"
          | stats count(*) as refusals by message.accountId, bin(1d)

    RateLimitedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rate-limited
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rate-limited"
          | stats count(*) as refusals by message.accountId, bin(1h)

    PollLimitedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/poll-limited
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "poll-limited"
          | stats count(*) as polls, count_distinct(message.accountId) as accounts by bin(1h)

    SortRequestFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sort-request-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sort-request-failed"
          | stats count(*) as failures by message.errorClass, bin(1h)

    SortRetriedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sort-retried
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sort-retried"
          | stats count(*) as retries, count_distinct(message.accountId) as accounts by message.errorClass, bin(1h)

    AskSortedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-sorted
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-sorted"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    SortFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sort-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sort-failed"
          | stats count(*) as failures by message.errorClass, bin(1h)

    # By account, to tell one scripted account from a cap set too low.
    SortCappedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sort-capped
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sort-capped"
          | stats count(*) as sorts by message.accountId, bin(1d)

    RulesSavedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-saved
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-saved"
          | stats count(*) as saves, count_distinct(message.accountId) as accounts by bin(1d)

    RulesResavedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-resaved
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-resaved"
          | stats count(*) as saves, count_distinct(message.accountId) as accounts by bin(1d)

    RulesReadFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-read-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-read-failed"
          | stats count(*) as failures by message.errorClass, bin(1h)

    RulesLimitedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-limited
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-limited"
          | stats count(*) as saves, count_distinct(message.accountId) as accounts by bin(1h)

    RulesCappedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-capped
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-capped"
          | stats count(*) as saves by message.accountId, bin(1d)

    RequestFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/request-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "request-failed"
          | stats count(*) as failures by message.errorClass, message.status, bin(1d)

  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebUrl:
      Value: !Join ["", ["https://", !GetAtt WebDistribution.DomainName]]
