# The deployment definition (ADR 5). One stage, deployed only by a green merge
# to main (ADR 4). The deploy role and its OIDC provider are a separate stack,
# infra/github-oidc.cfn.yml, which the deploy job applies first.
service: askme
# Patch releases only, as Serverless advises. A minor upgrade is a pull request.
frameworkVersion: "~4.43.0"

provider:
  name: aws
  region: ${env:AWS_REGION}
  stage: prod
  runtime: nodejs22.x
  timeout: 10
  # Logs are kept as long as the data (ADR 7).
  logRetentionInDays: 30
  logs:
    lambda:
      # Every function logs JSON, so each line carries the level its console
      # method sets. There is no debug level (ADR 7).
      logFormat: JSON
      applicationLogLevel: INFO
      systemLogLevel: INFO
  environment:
    # The Clerk instance whose tokens the service accepts. Its keys are
    # public, so no Clerk secret reaches the function (ADR 6).
    CLERK_ISSUER: ${env:CLERK_ISSUER}
    # The one table (ADR 13).
    TABLE_NAME: !Ref Table
    # The function that sorts an ask after it is posted.
    SORT_FUNCTION: ${self:service}-${sls:stage}-sort
    # The name of the service's OpenRouter key in Parameter Store, which
    # issue #1 fixed. The functions read the key when they first need it,
    # so it is in neither this file nor their settings.
    MODEL_KEY_PARAMETER: /askme/openrouter/api-key
  iam:
    role:
      statements:
        # Reads along one account's keys and transactional writes. No scan,
        # and nothing beyond the one table (ADR 13).
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:ConditionCheckItem
          Resource: !GetAtt Table.Arn
        # The service's model key, and nothing else in Parameter Store. It
        # is encrypted with AWS's own key for Parameter Store, which lets
        # any role in the account that may read the parameter decrypt it.
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/askme/openrouter/api-key"
        # Handing a posted ask to the sort function.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-sort"

build:
  esbuild:
    # The repo is ES modules. Lambda loads a .mjs bundle as one.
    format: esm
    outExtension:
      ".js": ".mjs"

functions:
  # The MCP endpoint, the metadata that says where to sign in, and the
  # page's API. Every route here is one the service knows, and all but the
  # metadata check a token (ADR 6). The page reaches its API through the
  # distribution, under /api/.
  mcp:
    handler: service/src/handler.handler
    events:
      - httpApi: "POST /mcp"
      - httpApi: "GET /mcp"
      - httpApi: "DELETE /mcp"
      - httpApi: "GET /.well-known/oauth-protected-resource/mcp"
      - httpApi: "GET /api/asks"
      - httpApi: "GET /api/connection"
      - httpApi: "GET /api/rules"
      - httpApi: "PUT /api/rules"
      - httpApi: "POST /api/asks/opened"
      - httpApi: "POST /api/asks/dismissed"

  # Sorts one ask after the service has stored it and answered, so posting
  # never waits on the model. The mcp function invokes it asynchronously,
  # with an ask's id, for a new ask and for every open ask when the rules
  # are saved. It has no route. A sort that fails leaves the ask as it was,
  # and a later poll asks again, so Lambda does not retry it.
  sort:
    handler: service/src/sorter.handler
    # Two tries at the model, of up to 20 seconds each.
    timeout: 60
    maximumRetryAttempts: 0

resources:
  Resources:
    # The one table (ADR 13). Every item's partition key is the account, and
    # its sort key says what the item is. No secondary index. Billed per
    # request, so it costs nothing while idle (ADR 5). DynamoDB removes
    # expired items late, so every read checks expiresAt itself.
    Table:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # The page's static files. Private: only the distribution below reads it.
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced

    WebOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: askme-web
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: askme page
          DefaultRootObject: index.html
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_100
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            # The page's API, on the page's own address, so the page needs
            # no API address at build time and no cross-origin rules.
            - Id: api
              DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
          DefaultCacheBehavior:
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed policies: CachingOptimized and SecurityHeadersPolicy.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          CacheBehaviors:
            # Each answer is one account's, and the token is in the
            # Authorization header, so nothing is cached and every header
            # but Host goes on. AWS managed policies: CachingDisabled,
            # AllViewerExceptHostHeader and SecurityHeadersPolicy.
            # Saving the rules is a PUT, and CloudFront allows it only
            # within its full set of methods.
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: TheDistributionReadsThePage
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ["", [!GetAtt WebBucket.Arn, "/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn: !Join
                    - ""
                    - - "arn:"
                      - !Ref AWS::Partition
                      - ":cloudfront::"
                      - !Ref AWS::AccountId
                      - ":distribution/"
                      - !Ref WebDistribution

    # Alerts (ADR 8). Four alarms, all publishing to this one topic, which
    # emails the owner. The address is the parameter issue #1 fixed. AWS
    # sends a confirmation link first, and nothing arrives until the owner
    # clicks it.
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: askme-alerts
        DisplayName: askme alerts

    AlertEmail:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: email
        TopicArn: !Ref AlertTopic
        Endpoint: ${ssm:/askme/alerts/email}

    # The net: every function gets one filter on the error level, and every
    # filter feeds the one metric the error-lines alarm reads. A function
    # added without one fails the gate. With no default value, a filter
    # publishes nothing while nothing goes wrong.
    McpErrorLines:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref McpLogGroup
        FilterPattern: '{ $.level = "ERROR" }'
        MetricTransformations:
          - MetricNamespace: askme
            MetricName: ErrorLines
            MetricValue: "1"

    SortErrorLines:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref SortLogGroup
        FilterPattern: '{ $.level = "ERROR" }'
        MetricTransformations:
          - MetricNamespace: askme
            MetricName: ErrorLines
            MetricValue: "1"

    ErrorLinesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-error-lines
        AlarmDescription: >-
          [tripwire] An askme function wrote an error-level line. Run the
          saved query askme/errors first.
        Namespace: askme
        MetricName: ErrorLines
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    # Failures that write no line: a crash, a timeout, running out of memory
    # (all counted as Errors) and throttling. Each function's two metrics
    # are added together.
    FunctionFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-function-failures
        AlarmDescription: >-
          [tripwire] An askme function failed, timed out or was throttled. Run
          the saved query askme/function-failures first. A throttle writes no
          line, so if it finds nothing, read the function's Throttles metric.
        Metrics:
          - Id: mcpErrors
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref McpLambdaFunction
              Period: 60
              Stat: Sum
          - Id: mcpThrottles
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Throttles
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref McpLambdaFunction
              Period: 60
              Stat: Sum
          - Id: sortErrors
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref SortLambdaFunction
              Period: 60
              Stat: Sum
          - Id: sortThrottles
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Throttles
                Dimensions:
                  - Name: FunctionName
                    Value: !Ref SortLambdaFunction
              Period: 60
              Stat: Sum
          - Id: failures
            Label: Failures
            Expression: SUM(METRICS())
            ReturnData: true
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    # The API failing for users in a way the first two did not see, such as
    # API Gateway failing to invoke the function.
    ServerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-server-errors
        AlarmDescription: >-
          [rate] More than 5% of the API's requests ended in a server error
          over five minutes. Run the saved query askme/errors first.
        Metrics:
          - Id: serverErrors
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/ApiGateway
                MetricName: 5xx
                Dimensions:
                  - Name: ApiId
                    Value: !Ref HttpApi
              Period: 300
              Stat: Sum
          - Id: requests
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/ApiGateway
                MetricName: Count
                Dimensions:
                  - Name: ApiId
                    Value: !Ref HttpApi
              Period: 300
              Stat: Sum
          - Id: errorRate
            Label: Server errors (%)
            Expression: IF(requests > 0, 100 * FILL(serverErrors, 0) / requests, 0)
            ReturnData: true
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    # The month's AWS bill. The account holds askme alone, so its bill is
    # askme's (ADR 17). AWS publishes it about every six hours, and only in
    # us-east-1, where askme runs. The amount is the parameter issue #1
    # fixed, in US dollars. A gap between bills keeps the alarm where it
    # was, so it does not leave ALARM and email again on the next bill. With
    # no bill at all, the account's billing alerts are off, and the alarm
    # shows INSUFFICIENT_DATA.
    SpendAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: askme-spend
        AlarmDescription: >-
          [tripwire] This month's AWS bill has passed the set amount. Run the
          saved query askme/lines-by-event first, then open Cost Explorer.
        Namespace: AWS/Billing
        MetricName: EstimatedCharges
        Dimensions:
          - Name: Currency
            Value: USD
        Statistic: Maximum
        Period: 21600
        EvaluationPeriods: 1
        Threshold: ${ssm:/askme/alerts/monthly-spend}
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: ignore
        AlarmActions:
          - !Ref AlertTopic

    # Saved queries (ADR 8). Product numbers are counted here, by event,
    # never by a metric. There is one for each event the service logs, and
    # one for each alarm to name as its first step. Each reads every
    # function's log group.
    ErrorsQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/errors
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          fields @timestamp, message.event, message.errorClass, message.status, message.requestId, errorType, @logStream
          | filter level = "ERROR"
          | sort @timestamp desc
          | limit 100

    FunctionFailuresQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/function-failures
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          fields @timestamp, type, record.status, record.errorType, record.requestId, @logStream
          | filter ispresent(record.status) and record.status != "success"
          | sort @timestamp desc
          | limit 100

    # Every line, counted by level and event. Warnings are counted here,
    # never alarmed.
    LinesByEventQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/lines-by-event
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter ispresent(message.event)
          | stats count(*) as lines by level, message.event
          | sort lines desc

    TokenMissingQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/token-missing
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "token-missing"
          | stats count(*) as calls by bin(1h)

    TokenRejectedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/token-rejected
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "token-rejected"
          | stats count(*) as calls by message.errorClass, bin(1h)

    ScopeMissingQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/scope-missing
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "scope-missing"
          | stats count(*) as calls by message.tool, bin(1h)

    AgentTokenRefusedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/agent-token-refused
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "agent-token-refused"
          | stats count(*) as calls by bin(1h)

    InputInvalidQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/input-invalid
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "input-invalid"
          | stats count(*) as calls by message.tool, bin(1d)

    AskPostedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-posted
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-posted"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskReplacedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-replaced
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-replaced"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskResolvedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-resolved
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-resolved"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskAlreadyClosedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-already-closed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-already-closed"
          | stats count(*) as calls, count_distinct(message.accountId) as accounts by bin(1d)

    AskNotFoundQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-not-found
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-not-found"
          | stats count(*) as calls, count_distinct(message.accountId) as accounts by bin(1d)

    # How often the person goes where the work is, and how often they clear
    # an ask themselves rather than its agent resolving it.
    AskOpenedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-opened
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-opened"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    AskDismissedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-dismissed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-dismissed"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    # How often an ask repeats one posted in the last ten minutes, to tune
    # the window (ADR 3).
    AskDeduplicatedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-deduplicated
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-deduplicated"
          | stats count(*) as repeats, count_distinct(message.accountId) as accounts by bin(1d)

    CapReachedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/cap-reached
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "cap-reached"
          | stats count(*) as refusals by message.accountId, bin(1d)

    RateLimitedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rate-limited
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rate-limited"
          | stats count(*) as refusals by message.accountId, bin(1h)

    PollLimitedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/poll-limited
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "poll-limited"
          | stats count(*) as polls, count_distinct(message.accountId) as accounts by bin(1h)

    # How often the service could not hand an ask to the sort function.
    SortRequestFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sort-request-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sort-request-failed"
          | stats count(*) as failures by message.errorClass, bin(1h)

    # How often a poll asked again for an ask left unsorted.
    SortRetriedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sort-retried
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sort-retried"
          | stats count(*) as retries, count_distinct(message.accountId) as accounts by bin(1h)

    AskSortedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/ask-sorted
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "ask-sorted"
          | stats count(*) as asks, count_distinct(message.accountId) as accounts by bin(1d)

    # Sorts the model gave no fitting reply for, by why: a status, a
    # timeout, or a reply the check discarded.
    SortFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/sort-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "sort-failed"
          | stats count(*) as failures by message.errorClass, bin(1h)

    RulesSavedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-saved
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-saved"
          | stats count(*) as saves, count_distinct(message.accountId) as accounts by bin(1d)

    RulesReadFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-read-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-read-failed"
          | stats count(*) as failures by message.errorClass, bin(1h)

    RulesLimitedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/rules-limited
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "rules-limited"
          | stats count(*) as saves, count_distinct(message.accountId) as accounts by bin(1h)

    RequestFailedQuery:
      Type: AWS::Logs::QueryDefinition
      Properties:
        Name: askme/request-failed
        LogGroupNames:
          - !Ref McpLogGroup
          - !Ref SortLogGroup
        QueryString: |
          filter message.event = "request-failed"
          | stats count(*) as failures by message.errorClass, message.status, bin(1d)

  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebUrl:
      Value: !Join ["", ["https://", !GetAtt WebDistribution.DomainName]]
